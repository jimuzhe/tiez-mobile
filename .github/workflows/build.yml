name: Build App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Detect release tag on current commit
        id: release_meta
        shell: bash
        run: |
          git fetch --force --tags
          TAG_NAME="$(git tag --points-at HEAD | grep '^v' | head -n 1 || true)"
          if [ -n "$TAG_NAME" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Android native project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Enable ABI split outputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          marker = '    androidResources {\n'
          split_block = '''    splits {\n        abi {\n            enable true\n            reset()\n            include "armeabi-v7a", "arm64-v8a", "x86_64"\n            universalApk false\n        }\n    }\n\n'''

          if "universalApk false" not in text:
            text = text.replace(marker, split_block + marker, 1)

          path.write_text(text)
          PY

      - name: Build release APKs locally
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TieZ-Android-Packages
          path: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
          retention-days: 7

      - name: Upload Android assets to GitHub Release
        if: steps.release_meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          files: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Detect release tag on current commit
        id: release_meta
        shell: bash
        run: |
          git fetch --force --tags
          TAG_NAME="$(git tag --points-at HEAD | grep '^v' | head -n 1 || true)"
          if [ -n "$TAG_NAME" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate iOS native project
        run: CI=1 npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Resolve iOS build paths
        id: ios_paths
        shell: bash
        run: |
          WORKSPACE_PATH="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1 || true)"
          PROJECT_PATH="$(find ios -maxdepth 1 -name '*.xcodeproj' | head -n 1 || true)"
          SCHEME_NAME="$(basename "${PROJECT_PATH%.xcodeproj}")"

          if [ -n "$WORKSPACE_PATH" ]; then
            echo "container_flag=-workspace" >> "$GITHUB_OUTPUT"
            echo "container_path=$WORKSPACE_PATH" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJECT_PATH" ]; then
            echo "container_flag=-project" >> "$GITHUB_OUTPUT"
            echo "container_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to find an iOS workspace or project after prebuild." >&2
            find ios -maxdepth 2 -type f | sort >&2 || true
            exit 1
          fi

          if [ -z "$SCHEME_NAME" ]; then
            echo "Unable to determine an iOS scheme name." >&2
            exit 1
          fi

          echo "scheme_name=$SCHEME_NAME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            ${{ steps.ios_paths.outputs.container_flag }} "${{ steps.ios_paths.outputs.container_path }}" \
            -scheme "${{ steps.ios_paths.outputs.scheme_name }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -n 1)"
          mkdir -p "$RUNNER_TEMP/ios-export/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ios-export/Payload/"
          cd "$RUNNER_TEMP/ios-export"
          /usr/bin/zip -qry TieZ-mobile.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TieZ-iOS-Package
          path: ${{ runner.temp }}/ios-export/TieZ-mobile.ipa
          retention-days: 7

      - name: Upload iOS asset to GitHub Release
        if: steps.release_meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          files: ${{ runner.temp }}/ios-export/TieZ-mobile.ipa
